name: release

# Build downloadable binaries. Run manually (Actions tab -> release -> Run workflow)
# to get artifacts, or push a tag like v0.1.0 to also publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: sshield.exe
            asset: sshield-windows-x64.exe
          - os: ubuntu-latest
            bin: sshield
            asset: sshield-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Use the tag as the app version (so auto-update can compare)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          grep -n '^version' Cargo.toml
      - run: cargo build --release -p sshield
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { "0.0.0" }
          & $iscc "/DAppVersion=$v" installer\sshield.iss
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sshield-windows-x64-setup.exe
          path: dist/sshield-windows-x64-setup.exe
      - name: Stage asset
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Debug keystore (beta builds are sideload-only)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          grep -n '^version' Cargo.toml
      - name: Build APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME NDK=$ANDROID_NDK_HOME"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo apk build --release -p sshield --lib
          cp target/release/apk/sshield.apk sshield-android-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sshield-android-beta.apk
          path: sshield-android-beta.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
