name: sshield

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch/PR cancels the older run instead of queueing behind it
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release -p sshield
      - uses: actions/upload-artifact@v4
        with:
          name: sshield-${{ matrix.os }}
          path: |
            target/release/sshield
            target/release/sshield.exe
          if-no-files-found: ignore

  android:
    name: android beta apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Debug keystore (beta builds are sideload-only)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME NDK=$ANDROID_NDK_HOME"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo apk build --release -p sshield --lib
          cp target/release/apk/sshield.apk sshield-android-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sshield-android-beta.apk
          path: sshield-android-beta.apk
