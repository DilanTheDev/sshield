[package]
name = "sshield"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sshield_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sshield"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
egui = "0.37"
futures = "0.3.34"
serde_json = "1.0.154"
sshield-core = { path = "../sshield-core" }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tokio = { version = "1.54.1", features = ["full"] }
vt100 = "0.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "x11"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
log = "0.4"

# Build with: cargo apk build --release -p sshield --lib   (see .github/workflows/release.yml)
[package.metadata.android]
package = "dev.sshield.app"
build_targets = ["aarch64-linux-android"]
apk_name = "sshield"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Beta builds are signed with the standard Android debug key (sideloading only, not Play Store).
[package.metadata.android.signing.release]
path = "$HOME/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "sshield (beta)"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode"
launch_mode = "singleTop"
