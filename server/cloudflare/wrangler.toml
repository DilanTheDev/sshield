name = "sshield-sync"
main = "worker.js"
compatibility_date = "2025-01-01"

# Create the namespace once:  npx wrangler kv namespace create VAULTS
# then paste the printed id below.
[[kv_namespaces]]
binding = "VAULTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Shared terminal sessions (one Durable Object per room; free-plan compatible SQLite class)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
